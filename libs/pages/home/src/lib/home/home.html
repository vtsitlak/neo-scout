<section
  class="mx-auto flex w-full max-w-3xl flex-col items-center gap-8 py-6 text-center sm:py-10"
>
  <img
    [ngSrc]="logoLgSrc()"
    alt="NEO Scout"
    width="280"
    height="72"
    priority
    class="h-18 w-auto max-w-full"
  />

  <p
    class="max-w-2xl font-sans text-base leading-relaxed text-(--ns-fg-muted) sm:text-lg"
  >
    NEO Scout helps you follow newly discovered near-Earth asteroid candidates
    from NASA/JPL Scout — review close approaches, observation arcs, and hazard
    indicators in one place, then reach out when you need support.
  </p>

  <div class="flex flex-wrap items-center justify-center gap-4">
    <p-button
      label="Scout"
      size="large"
      routerLink="/scout"
      class="font-display!"
    />
    <p-button
      label="Contact"
      size="large"
      severity="secondary"
      [outlined]="true"
      routerLink="/contact"
      class="font-display!"
    />
  </div>
</section>
