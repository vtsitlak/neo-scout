<footer class="w-full text-(--ns-fg-muted)">
  <p-divider layout="horizontal" class="m-0! w-full" />

  <div
    class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 px-4 py-3 text-sm"
  >
    <span>v{{ appInfo().version }}</span>
    <span aria-hidden="true">©</span>
    <span>{{ appInfo().copyright.year }}</span>
    <a
      class="text-(--ns-primary) underline-offset-2 hover:underline"
      [href]="'mailto:' + appInfo().copyright.email"
      >{{ appInfo().copyright.email }}</a
    >
    <a
      class="text-(--ns-primary) underline-offset-2 hover:underline"
      [href]="appInfo().source"
      target="_blank"
      rel="noopener noreferrer"
      >{{ appInfo().source }}</a
    >
  </div>
</footer>
