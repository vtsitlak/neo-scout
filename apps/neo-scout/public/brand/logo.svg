<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" role="img" aria-label="NEO Scout">
  <title>NEO Scout</title>
  <style>
    .wordmark {
      font-family: 'Space Grotesk', 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 32px;
      letter-spacing: -0.03em;
    }
    .neo { fill: #0f172a; }
    .scout { fill: #0e7490; }
    .orbit { fill: none; stroke: #0891b2; stroke-width: 2.5; }
    .trail { fill: none; stroke: #d97706; stroke-width: 2; stroke-linecap: round; opacity: 0.9; }
    .body { fill: #0e7490; }
    .crater { fill: #d97706; }
    .shadow { fill: #ffffff; opacity: 0.4; }
    @media (prefers-color-scheme: dark) {
      .neo { fill: #f5f7fb; }
      .scout { fill: #67e8f9; }
      .orbit { stroke: #22d3ee; }
      .trail { stroke: #fbbf24; }
      .body { fill: #67e8f9; }
      .crater { fill: #fbbf24; }
      .shadow { fill: #0b1220; opacity: 0.35; }
    }
  </style>
  <!-- Inlined mark (external &lt;image href&gt; is blocked when SVG is used as &lt;img&gt;) -->
  <ellipse class="orbit" cx="32" cy="32" rx="22" ry="12" transform="rotate(-28 32 32)" />
  <path class="trail" d="M14 40 C22 34, 28 30, 34 28" />
  <circle class="body" cx="40" cy="26" r="7.5" />
  <circle class="crater" cx="37.5" cy="24.5" r="1.6" />
  <circle class="shadow" cx="42" cy="28" r="1.1" />
  <text x="72" y="42" class="wordmark">
    <tspan class="neo">NEO</tspan>
    <tspan class="scout"> Scout</tspan>
  </text>
</svg>
