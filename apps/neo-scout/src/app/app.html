<main class="min-h-screen bg-slate-50 px-6 py-10 text-slate-900">
  <section class="mx-auto flex max-w-5xl flex-col gap-6">
    <header class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-sm font-medium tracking-wide text-slate-500 uppercase">
          Nx Angular monorepo
        </p>
        <h1 class="text-3xl font-semibold tracking-tight">
          {{ store.title() }}
        </h1>
      </div>
      <p-button
        label="Stack ready"
        icon="pi pi-check"
        [disabled]="store.ready()"
      />
    </header>

    <div
      class="h-64 w-full overflow-hidden rounded-lg border border-slate-200 bg-white"
    >
      <ag-grid-angular
        class="h-full w-full"
        [theme]="gridTheme"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
      />
    </div>

    <router-outlet />
  </section>
</main>
