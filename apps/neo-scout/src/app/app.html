<div class="flex min-h-screen flex-col bg-ns-bg text-ns-fg">
  <p-toast position="center" />

  <neo-header-navigation [items]="navItems">
    <p-button
      startPlaceholder
      type="button"
      routerLink="/"
      [text]="true"
      severity="secondary"
      ariaLabel="NEO Scout home"
      class="p-1!"
    >
      <img
        [ngSrc]="logoSrc()"
        alt="NEO Scout"
        width="168"
        height="42"
        priority
        class="h-8 w-auto"
      />
    </p-button>

    <neo-theme-toggle endPlaceholder />
  </neo-header-navigation>

  <main class="mx-auto w-full max-w-5xl flex-1 px-6 py-8">
    <router-outlet />
  </main>

  <neo-info-footer [appInfo]="appInfo" />
</div>
